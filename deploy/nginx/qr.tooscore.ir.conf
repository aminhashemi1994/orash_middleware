# Orash Scan — nginx site for qr.tooscore.ir
#
# Terminates TLS and proxies to the Node service on 127.0.0.1:4173.
# Install with deploy/install.sh, or by hand:
#
#   sudo cp deploy/nginx/qr.tooscore.ir.conf /etc/nginx/sites-available/qr.tooscore.ir
#   sudo ln -s /etc/nginx/sites-available/qr.tooscore.ir /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates come from certbot:
#   sudo certbot certonly --webroot -w /var/www/certbot -d qr.tooscore.ir

upstream orash_scan {
    server 127.0.0.1:4173;
    keepalive 16;
}

# ------------------------------------------------------------------ port 80
# Everything redirects to HTTPS. The phone camera only works in a secure
# context, so plain HTTP is not merely discouraged here — the app is unusable
# over it.
server {
    listen 80;
    listen [::]:80;
    server_name qr.tooscore.ir;

    # Leave the ACME path reachable so renewals do not need the redirect lifted.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------- port 443
server {
    # The `ssl http2` form loads on every nginx still in the wild. nginx 1.25.1+
    # deprecates it in favour of a separate `http2 on;` — install.sh rewrites
    # these two lines when it detects a new enough nginx.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qr.tooscore.ir;

    ssl_certificate     /etc/letsencrypt/live/qr.tooscore.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qr.tooscore.ir/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:OrashSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # The panel opens the camera and (on the desktop) a serial device. Both are
    # same-origin only; nothing is embedded, so framing is denied outright.
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), serial=(self), microphone=(), geolocation=()" always;

    # CreateInvoice bodies stay small, but the proxy accepts up to 5 MB.
    client_max_body_size 6m;

    access_log /var/log/nginx/qr.tooscore.ir.access.log;
    error_log  /var/log/nginx/qr.tooscore.ir.error.log;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- phone -> panel relay (Server-Sent Events) -------------------------
    # Buffering must be off or nginx holds the stream and scans never arrive at
    # the panel. The long read timeout keeps an idle pairing session alive; the
    # service also sends a comment heartbeat every 25s.
    location = /scan/stream {
        proxy_pass http://orash_scan;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
    }

    # --- fingerprinted-ish static assets ----------------------------------
    location ^~ /vendor/ {
        proxy_pass http://orash_scan;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --- everything else ---------------------------------------------------
    location / {
        proxy_pass http://orash_scan;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The Orash host can be slow; the service gives up at 20s on its own.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
